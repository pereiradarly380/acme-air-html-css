<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Recuperar Contraseña</title>
    <link rel="icon" href="img/icono.jpg" sizes="96x96">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <section class="login-card menu--card vuelos-card">
             <div class="logo logo--menu">
                <img src="img/logo_menu.jpg" alt="ACME AIR Logo">
            </div>

            <div class="login-header">
                <h2>Recuperar Contraseña</h2>
            </div>

            <form action="crear-contraseña.html" method="GET">

                <div class="campo-registro">
                    <input type="email" id="email" name="email" placeholder="Email" required >
                </div>
                 
                <p> Si el e-mail se encuentra registrado se enviara un link para continuar con la recuperacion de su contraseña.</p>

                <button type="submit" class="btn-guardar">ENVIAR</button>

            </form>

        </section>
    </main>
</body>
</html>
