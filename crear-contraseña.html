<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Contraseña</title>
    <link rel="icon" href="img/icono.jpg" sizes="96x96">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <section class="login-card card--contraseña vuelos-card">
             <div class="logo logo--menu">
                <img src="img/logo_menu.jpg" alt="ACME AIR Logo">
            </div>

            <div class="login-header">
                <h2>Crear Contraseña</h2>
            </div>

            <form action="menu.html" method="GET">

                <div class="campo-registro">
                    <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña" required >
                </div>

                <div class="campo-registro">
                    <input type="password" id="RepetirContraseña" name="RepetirContraseña" placeholder="Repetir contraseña" required>
                </div>

                <button type="submit" class="btn-guardar">GUARDAR</button>

            </form>

        </section>
    </main>
</body>
</html>
