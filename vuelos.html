<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - vuelos</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">

        <section class="seccion">

            <div class="login-header">
                <h1>ACME AIR</h1>
                <h2>Vuelos disponibles</h2>
                <p>Encuentra el vuelo ideal para tu viaje</p>
            </div>

            <div class="tabla-contenedor">

                <table>
                    <thead>
                        <tr>
                            <th>Ruta</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Precio</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Bogotá → Medellín</td>
                            <td>10/10/2026</td>
                            <td>08:30</td>
                            <td>$180.000</td>
                        </tr>

                        <tr>
                            <td>Bogotá → Cartagena</td>
                            <td>12/10/2026</td>
                            <td>10:00</td>
                            <td>$250.000</td>
                        </tr>

                        <tr>
                            <td>Medellín → Cali</td>
                            <td>15/10/2026</td>
                            <td>14:30</td>
                            <td>$190.000</td>
                        </tr>

                        <tr>
                            <td>Cali → Bogotá</td>
                            <td>18/10/2026</td>
                            <td>17:00</td>
                            <td>$210.000</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <br>

            <a href="menu.html" class="btn-primary">
                Volver al menú
            </a>

        </section>

    </main>
</body>
</html>
