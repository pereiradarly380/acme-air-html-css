<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Iniciar Sesión</title>
    <link rel="icon" href="img/icono.jpg" sizes="96x96">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <section class="login-card">

            <div class="logo">
                <img src="img/icono.jpg">
            </div>

            <div class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus datos para continuar</p>
            </div>

            <form>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <div class="opciones">
                    <label>
                        <input type="checkbox" name="recordar">
                        Recordar mis datos
                    </label>

                    <a href="recuperar.html">
                        ¿Has olvidado tu contraseña?
                    </a>
                </div>

                <button href="menu.html" class="btn-primary">
                    Ingresar
                </button>

                <a href="menu.html" class="btn-primary">
                    Ingresar
                </a>
            </form>

            <p class="registro-link">
                ¿No tienes una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>

        </section>
    </main>
</body>
</html>
