<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Buscar Vuelos</title>
    <link rel="icon" href="img/icono.jpg" sizes="96x96">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <section class="login-card">
             <div class="logo logo--menu">
                <img src="img/logo_menu.jpg" alt="ACME AIR Logo">
            </div>
            <div class="login-header">
                <h2>Buscar Vuelos</h2>
            </div>
            <form action="vuelos.html" method="GET">
                <div class="campo-registro">
                    <input type="text" id="origen" name="origen" placeholder="Ciudad de Origen" required>
                </div>
                <div class="campo-registro">
                    <input type="text" id="destino" name="destino" placeholder="Ciudad de Destino" required>
                </div>
                <div class="campo-registro">
                    <input type="date" id="fecha-salida" name="fecha-salida" required>
                </div>
                <div class="campo-registro" id="campo-regreso">
                    <input type="date" id="fecha-regreso" name="fecha-regreso">
                </div>
                <div class="checkbox-fila">
                    <label class="check-label">
                        <input type="checkbox" id="solo-ida" name="solo-ida"> Solo ida
                    </label>
                </div>
                <button type="submit" class="btn-guardar">BUSCAR</button>
            </form>
        </section>
    </main>
</body>
</html>
