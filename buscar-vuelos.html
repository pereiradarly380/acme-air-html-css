<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACME AIR - Buscar Vuelos</title>

    <link rel="icon" href="img/icono.jpg" sizes="96x96">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="contenedor">

        <section class="login-card menu--card vuelos-card">

            <div class="logo logo--menu">
                <img src="img/logo_menu.jpg" alt="ACME AIR Logo">
            </div>
            

            <div class="login-header">
                <h2>Buscar Vuelos</h2>
            </div>

            <form action="vuelos.html" method="GET">

                <div class="campo-registro">
                    <select id="origen" name="origen" required>
                        <option value="" disabled selected hidden>Origen</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="bucaramanga">Bucaramanga</option>
                        <option value="cartagena">Cartagena</option>
                    </select>
                </div>

                <div class="campo-registro">
                    <select id="destino" name="destino" required>
                        <option value="" disabled selected hidden>Destino</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="bucaramanga">Bucaramanga</option>
                        <option value="cartagena">Cartagena</option>
                    </select>
                </div>

                <div class="campo-registro">
                    <input type="date" id="salida" name="salida" required>
                </div>

                <div class="campo-registro">
                    <input type="date" id="regreso" name="regreso">
                </div>

                <div class="campo-registro checkbox-vuelo campo-solo-ida">
                    <input type="checkbox" id="solo-ida" name="solo-ida">
                    <label for="solo-ida">Solo ida</label>
                </div>

                <button type="submit" class="btn-guardar">
                    BUSCAR
                </button>

            </form>

        </section>

    </main>

</body>

</html>
