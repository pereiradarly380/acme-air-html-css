<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACME AIR - Vuelos disponibles</title>

    <link rel="icon" href="img/icono.jpg" sizes="96x96">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="contenedor">

        <section class="login-card menu--card vuelos-card">

            <div class="logo logo--menu">
                <img src="img/logo_menu.jpg" alt="ACME AIR Logo">
            </div>

            <div class="usuario-header">
                <img src="img/icons/icon-perfil.jpg"
                     alt="Icono de usuario"
                     class="usuario-avatar">

                <div>
                    <h2>John Doe</h2>
                    <a href="index.html" class="logout-link">Cerrar Sesión</a>
                </div>
            </div>

            <div class="vuelos-titulo title--check-in">
                <h3>
                    Check In
                </h3>
            </div>

            <ul class="mv-lista">

                <li class="mv-vuelo">

                    <img src="img/icons/icon-viajes.jpg" alt="" class="vuelo-icono">

                    <div class="mv-horario">
                        <span>17:00 - 18:30</span>
                        <strong>1h 30 min</strong>
                        
                        <div class="vuelos-resumen">
                            <p>Barranquilla → Bogotá</p>
                        </div>
                    </div>

                    <div class="mv-detalle">
                        <span>VAA426</span>
                        <p class="vuelo-precio">
                            <small>COP</small> 235.000
                        </p>
                    </div>
                </li>
            </ul>

            <ul class="lista-vuelo" >

                <li class="check-item">
                    <form action="menu.html" method="GET">

                        <br>
                        <h3>Contacto en caso de emergencia</h3>
                        <br>
    
                        <div class="campo-registro">
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required >
                        </div>

                        <div class="campo-registro">
                            <input type="text" id="telefono" name="telefono" placeholder="No. Telefono celular" required>
                        </div>

                        <button type="submit" href="menu.html" class="btn-guardar">Guardar</button>
                    </form>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
